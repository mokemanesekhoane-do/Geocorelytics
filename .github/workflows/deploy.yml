# Deploy to Railway on every push to main.
#
# Why this exists: Railway's native git auto-deploy needs its GitHub App
# installed on the repo, which requires authorising Railway against this
# GitHub account. This workflow deploys with a project token instead, so
# pushes ship without that connection.
#
# One-time setup — add ONE of these as a GitHub repository secret
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#
#   RAILWAY_TOKEN      a *project* token, created at
#                      Railway -> Geocorelytics -> Settings -> Tokens,
#                      scoped to the production environment. Preferred:
#                      it can only touch this one project.
#
#   RAILWAY_API_TOKEN  an *account* token, created at
#                      railway.com/account/tokens. Broader access; use
#                      this if the project token gives permission errors.
#
# Either name works — whichever is set is passed to the CLI. Until one
# exists the workflow skips itself rather than failing, so a missing
# token never shows up as a red X on the commit.

name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual re-deploy from the Actions tab

concurrency:
  # A newer push supersedes an in-flight deploy rather than racing it.
  group: railway-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for deploy token
        id: guard
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ] && [ -z "${{ secrets.RAILWAY_API_TOKEN }}" ]; then
            echo "No Railway token secret set — skipping deploy."
            echo "Add RAILWAY_TOKEN (project) or RAILWAY_API_TOKEN (account)."
            echo "See the setup steps in .github/workflows/deploy.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Install Railway CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm install -g @railway/cli

      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        env:
          # Read the secrets under neutral names, then export ONLY the one
          # that has a value. Exporting both would set the unused one to an
          # empty string, and the CLI treats a present-but-empty
          # RAILWAY_TOKEN as an invalid token rather than as unset.
          PROJECT_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ACCOUNT_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: |
          if [ -n "$PROJECT_TOKEN" ]; then
            echo "Authenticating with project token (RAILWAY_TOKEN)."
            export RAILWAY_TOKEN="$PROJECT_TOKEN"
          else
            echo "Authenticating with account token (RAILWAY_API_TOKEN)."
            export RAILWAY_API_TOKEN="$ACCOUNT_TOKEN"
          fi
          railway up --ci --service Geocorelytics --message "$(echo "$COMMIT_MESSAGE" | head -n 1)"
