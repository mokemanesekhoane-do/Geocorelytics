<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050e1c" />
  <title>GeoCorelytics</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="charts.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body>
  <div id="auth-root" class="auth-root hidden"></div>

  <div class="shell hidden" id="shell">
    <!-- Phone-only header. The sidebar becomes a drawer below 900px, so the
         brand and the menu control have to live somewhere always visible. -->
    <header class="mobile-bar">
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <span></span><span></span><span></span>
      </button>
      <img class="mobile-bar-logo" src="assets/geocorelytics-logo.png" alt="GeoCorelytics" />
      <div class="mobile-bar-user" id="mobile-user-chip"></div>
    </header>

    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="brand-logo" src="assets/geocorelytics-logo.png" alt="GeoCorelytics" />
      </div>

      <nav class="sidenav" id="sidenav"></nav>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="search-wrap">
          <span class="search-icon">&#128269;</span>
          <input id="global-search" type="text" placeholder="Search projects or boreholes&hellip;" autocomplete="off" />
          <div id="search-results" class="search-results hidden"></div>
        </div>
        <div class="topbar-right">
          <nav id="breadcrumb" class="breadcrumb"></nav>
          <div class="user-chip" id="user-chip"></div>
        </div>
      </header>

      <main id="app" class="app"></main>
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="derive.js"></script>
  <script src="charts.js"></script>
  <script src="lookups.js"></script>
  <script src="analytics.js"></script>
  <script src="app.js"></script>
</body>
</html>
